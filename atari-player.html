<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atari player</title><link rel="stylesheet" href="atari-player.css"></head><body>
<div class="player"><div class="layout"><section id="stage" aria-label="Game screen"><div id="scaler"><div id="javatari-screen"></div><div id="javatari-console-panel"></div></div><div id="cover"><p id="opening">Press START to play.</p></div></section><div class="buttons"><button id="start" aria-label="Start game"><img src="assets/atari/S.png" alt="START" width="127" height="101"></button><button id="pause" aria-label="Pause game" aria-pressed="false" disabled><img src="assets/atari/P.png" alt="PAUSE" width="127" height="101"></button><button id="reset" aria-label="Reset game" disabled><img src="assets/atari/R.png" alt="RESET" width="127" height="101"></button></div></div><div class="status-row"><p id="status" role="status"></p><button id="retry" hidden>Try again</button></div></div>
<button id="finish-shopping" hidden disabled>Finish Shopping</button><script src="javatari/javatari.js"></script><script src="atari-player.js"></script></body></html>
